name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Set the repository variable PUBLISH=true (Settings →
    # Secrets and variables → Actions → Variables) when going public; until then this job is skipped
    # and CI stays green.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.PUBLISH == 'true'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub Pages sometimes leaves a deployment stuck "in progress" for up to half an hour and
      # refuses every new one meanwhile (2026-11-04). Wait it out and try twice more before failing.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 600
      - id: retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 600
      - id: retry2
        if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
